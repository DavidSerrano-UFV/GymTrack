<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Registro diario de alimentación de GymTrack."
    >

    <title>
        GymTrack | Comidas del día
    </title>


    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- HEADER -->
    <header class="app-header">

        <div class="container header-content">


            <a
                href="index.html"
                class="brand brand-link"
            >

                <span class="brand-mark">
                    GT
                </span>


                <span>

                    <strong>
                        GymTrack
                    </strong>

                    <small>
                        Diario de alimentación
                    </small>

                </span>

            </a>


            <a
                href="comidas.html"
                class="secondary-button nav-link"
            >
                ← Calendario
            </a>


        </div>

    </header>



    <!-- CONTENIDO -->
    <main class="container app-main">


        <!-- CABECERA DEL DÍA -->
        <section class="food-day-header">


            <div>

                <p class="eyebrow">
                    REGISTRO DIARIO
                </p>


                <h1 id="dayTitle">
                    Comidas del día
                </h1>


                <p id="daySubtitle">
                    Añade una fotografía a cada comida.
                </p>

            </div>



            <!-- TOTAL CALORÍAS -->
            <div class="daily-calories">

                <span>
                    Total estimado
                </span>


                <strong id="dailyCalories">
                    — kcal
                </strong>


                <small>
                    La IA se añadirá después
                </small>

            </div>


        </section>



        <!-- COMIDAS -->
        <section
            id="mealGrid"
            class="meal-grid"
        >



            <!-- ===================== -->
            <!-- DESAYUNO -->
            <!-- ===================== -->

            <article
                class="meal-card"
                data-meal="desayuno"
            >


                <header class="meal-card-header">

                    <div>

                        <span class="meal-order">
                            01
                        </span>

                        <h2>
                            Desayuno
                        </h2>

                    </div>


                    <span class="meal-calories">
                        — kcal
                    </span>

                </header>



                <div
                    class="meal-photo-list"
                    data-photo-list="desayuno"
                ></div>



                <label class="meal-upload-button">


                    <input
                        type="file"
                        accept="image/*"
                        capture="environment"
                        data-upload="desayuno"
                    >


                    <span>
                        ＋
                    </span>


                    Añadir foto


                </label>


            </article>



            <!-- ===================== -->
            <!-- COMIDA -->
            <!-- ===================== -->

            <article
                class="meal-card"
                data-meal="comida"
            >


                <header class="meal-card-header">

                    <div>

                        <span class="meal-order">
                            02
                        </span>

                        <h2>
                            Comida
                        </h2>

                    </div>


                    <span class="meal-calories">
                        — kcal
                    </span>

                </header>



                <div
                    class="meal-photo-list"
                    data-photo-list="comida"
                ></div>



                <label class="meal-upload-button">


                    <input
                        type="file"
                        accept="image/*"
                        capture="environment"
                        data-upload="comida"
                    >


                    <span>
                        ＋
                    </span>


                    Añadir foto


                </label>


            </article>



            <!-- ===================== -->
            <!-- MERIENDA -->
            <!-- ===================== -->

            <article
                class="meal-card"
                data-meal="merienda"
            >


                <header class="meal-card-header">

                    <div>

                        <span class="meal-order">
                            03
                        </span>

                        <h2>
                            Merienda
                        </h2>

                    </div>


                    <span class="meal-calories">
                        — kcal
                    </span>

                </header>



                <div
                    class="meal-photo-list"
                    data-photo-list="merienda"
                ></div>



                <label class="meal-upload-button">


                    <input
                        type="file"
                        accept="image/*"
                        capture="environment"
                        data-upload="merienda"
                    >


                    <span>
                        ＋
                    </span>


                    Añadir foto


                </label>


            </article>



            <!-- ===================== -->
            <!-- CENA -->
            <!-- ===================== -->

            <article
                class="meal-card"
                data-meal="cena"
            >


                <header class="meal-card-header">

                    <div>

                        <span class="meal-order">
                            04
                        </span>

                        <h2>
                            Cena
                        </h2>

                    </div>


                    <span class="meal-calories">
                        — kcal
                    </span>

                </header>



                <div
                    class="meal-photo-list"
                    data-photo-list="cena"
                ></div>



                <label class="meal-upload-button">


                    <input
                        type="file"
                        accept="image/*"
                        capture="environment"
                        data-upload="cena"
                    >


                    <span>
                        ＋
                    </span>


                    Añadir foto


                </label>


            </article>


        </section>


    </main>



    <!-- MENSAJES -->
    <div
        class="toast"
        id="foodToast"
        role="status"
        aria-live="polite"
    ></div>



    <!-- JAVASCRIPT -->

    <script src="food-storage.js"></script>

    <script src="dia-comidas.js"></script>


</body>

</html>
